<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>杜陵杜氏世譜 · 공개</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">杜陵杜氏世譜 <span>공개 전용</span></div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="filters">
        <input id="search" type="search" placeholder="면번호 · 이름 검색" autocomplete="off">
      </div>
      <div id="list-count" class="list-count"></div>
      <div id="page-list" class="page-list" role="list"></div>
    </aside>

    <main class="viewer">
      <div class="viewer-head">
        <div class="viewer-title">
          <strong id="page-title">페이지를 선택하세요</strong>
          <span id="page-meta" class="muted"></span>
        </div>
      </div>

      <div id="image-stage" class="image-stage">
        <img id="page-image" alt="" draggable="false">
        <div id="image-empty" class="image-empty">승인된 페이지가 없습니다</div>
        <div id="image-loading" class="image-loading">이미지를 불러오는 중…</div>
        <div class="zoom-controls">
          <button id="zoom-out" title="축소">−</button>
          <button id="zoom-100" title="100%">100%</button>
          <button id="zoom-200" title="200%">200%</button>
          <button id="zoom-400" title="400%">400%</button>
          <button id="zoom-in" title="확대">+</button>
          <span id="zoom-label">100%</span>
          <button id="zoom-fit" title="맞춤">맞춤</button>
          <button id="zoom-actual" title="원본 크기">원본</button>
        </div>
      </div>

      <div id="quality" class="quality"></div>

      <section id="people" class="people">
        <div class="people-head">인물</div>
        <div id="people-list" class="people-list"></div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
