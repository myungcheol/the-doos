# 杜陵杜氏世譜 테스트용 스택
#
#   docker compose up -d db                    # PostgreSQL 16
#   docker compose --profile tools run --rm import   # approved.jsonl 적재
#   docker compose --profile tools run --rm verify   # 적재 점검
#   docker compose --profile tools up admin          # 검수 도구 (http://127.0.0.1:8765)
#
# 값은 `.env` 또는 셸 환경변수에서 온다. 아래 기본값은 로컬 테스트 전용이므로
# 실제 배포에는 쓰지 않는다. 호스트에 psql/PostgreSQL이 없어도 된다.

name: the-doos

x-tools: &tools
  build:
    context: .
    dockerfile: docker/tools.Dockerfile
  image: the-doos-tools:local
  working_dir: /app
  # 컨테이너가 저장소에 만드는 파일이 root 소유가 되지 않게 호스트 uid/gid로 실행한다.
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    # 저장소 전체를 그대로 쓴다. data/pages 심볼릭 링크와 scan/도 컨테이너 안에서 보인다.
    - ./:/app
  profiles: ["tools"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doos}
      POSTGRES_USER: ${POSTGRES_USER:-doos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doos}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    ports:
      # 호스트에서도 붙을 수 있게 열어 둔다. 5432가 이미 쓰이면 .env에서 POSTGRES_PORT를 바꾼다.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # 새 볼륨으로 처음 뜰 때만 실행된다. 스키마를 바꾼 뒤에는 `docker compose down -v`로 초기화한다.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s

  import:
    <<: *tools
    depends_on:
      db:
        condition: service_healthy
    # 뒤에 인자를 덧붙일 수 있다: `... run --rm import --input data/parsed/genealogy/0025.json`
    # DSN은 compose가 .env 값으로 만든다. 비밀번호에 @ : / 같은 문자가 있으면 URL 인코딩한다.
    entrypoint: ["python3", "scripts/import_db.py"]
    command: ["--include-schema", "--dsn", "postgresql://${POSTGRES_USER:-doos}:${POSTGRES_PASSWORD:-doos}@db:5432/${POSTGRES_DB:-doos}"]

  verify:
    <<: *tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-doos}
      PGPASSWORD: ${POSTGRES_PASSWORD:-doos}
      PGDATABASE: ${POSTGRES_DB:-doos}
    entrypoint: ["psql"]
    command: ["-X", "-v", "ON_ERROR_STOP=1", "-f", "db/verify.sql"]

  # 검수 도구는 DB를 쓰지 않고 JSON 파일만 읽고 쓴다. 인증이 없으니 로컬에서만 쓴다.
  admin:
    <<: *tools
    ports:
      - "${ADMIN_PORT:-8765}:8765"
    command: ["python3", "admin/server.py", "--host", "0.0.0.0", "--port", "8765"]

  public:
    <<: *tools
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doos}:${POSTGRES_PASSWORD:-doos}@db:5432/${POSTGRES_DB:-doos}
    command: ["python3", "public/server.py", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  db-data:
