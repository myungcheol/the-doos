# Local DB: docker compose -f compose.yaml -f compose.web.yaml up -d --build web
# External DB: docker compose -f compose.web.yaml up -d --build web
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      # Local compose DB hostname is "postgres"; external deployments use their DB URL.
      JOKBO_WEB_DATABASE_URL: ${JOKBO_WEB_DATABASE_URL:?Set JOKBO_WEB_DATABASE_URL for the web container}
      JOKBO_ASSET_ROOT: /assets
      JOKBO_PUBLIC_EDITIONS: ${JOKBO_PUBLIC_EDITIONS:-}
    volumes:
      - ${JOKBO_ASSET_ROOT:-./jokbo-assets}:/assets:ro
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/editions').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
